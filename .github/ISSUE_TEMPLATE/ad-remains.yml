name: 広告が残っている
description: ADBAN を入れているのに、広告が表示されるサイトを教えてください
title: "[広告が残る] "
labels: ["広告が残る"]
body:
  - type: markdown
    attributes:
      value: |
        ご報告ありがとうございます。この場所は**誰でも読める公開の場所**です。名前・メールアドレス・パスワード・住所・閲覧履歴・アカウント情報は書かないでください。
        拡張機能の「問題を報告」ボタン（ポップアップの下）で、報告用の情報をコピーできます（自動では何も送られません）。
  - type: input
    id: domain
    attributes:
      label: サイトのドメイン
      description: 例 example.com（URL の「?」より後ろは書かないでください）
      placeholder: example.com
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 広告が出るページの URL（任意）
      description: 「?」より後ろ（クエリ）や、ログインが必要なページの URL は書かないでください
    validations:
      required: false
  - type: dropdown
    id: kind
    attributes:
      label: どの広告ですか
      multiple: true
      options:
        - バナー広告
        - 動画広告（YouTube・Prime Video など）
        - 記事広告（PR・スポンサード）
        - ポップアップ・新しいタブで開く広告
        - 「広告ブロッカーを無効にしてください」という警告
        - 空の広告枠（「広告」の札だけが残る）
        - その他
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: くわしい様子
      description: どこに、どのような広告が出ますか。画面の写真を貼る場合は、個人情報が写っていないことを確かめてください。
    validations:
      required: true
  - type: input
    id: since
    attributes:
      label: いつからですか
      description: 例 最近、昨日から、ずっと
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: ADBAN の版
      description: chrome://extensions（Edge は edge://extensions）に表示されます
      placeholder: 例 1.1.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: ブラウザーと版
      placeholder: 例 Chrome 131、Edge 131
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: 「問題を報告」でコピーした内容
      description: 拡張機能の「問題を報告」で、コピーした内容を貼り付けてください（貼り付ける前に、内容を確認できます）。
      render: markdown
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 個人情報について
      options:
        - label: 名前・メールアドレス・パスワード・住所・閲覧履歴・アカウント情報を書いていません
          required: true
